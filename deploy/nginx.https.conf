events {}
http {
    # Never log query strings: the WebSocket handshake contains a bearer token.
    log_format safe '$remote_addr "$request_method $uri $server_protocol" $status';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log crit;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        location = /_gateway_auth {
            internal;
            proxy_pass http://web:8000/api/gateway-check/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Original-URI $request_uri;
        }
        # No public access to Guacamole's APIs or login page.
        location = /guacamole/websocket-tunnel {
            auth_request /_gateway_auth;
            proxy_pass http://guacamole:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location /guacamole/ { return 404; }
        location = /api/gateway-check/ { return 404; }
        location ~ ^/(login|admin/login)/$ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
